services:
    parser:
        build: .
        container_name: ufaru-go-parser
        env_file:
            - .env
        environment:
            TZ: Europe/Moscow
        depends_on:
            kafka:
                condition: service_healthy
        restart: unless-stopped

    kafka:
        image: confluentinc/cp-kafka:7.6.0
        container_name: ufaru-go-kafka
        environment:
            KAFKA_NODE_ID: '1'
            KAFKA_PROCESS_ROLES: 'broker,controller'
            KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
            KAFKA_LISTENERS: 'INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9093'
            KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:9092,EXTERNAL://localhost:9093'
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT'
            KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
            KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
            CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
        ports:
            - "9093:9093"
        volumes:
            - kafka-data:/var/lib/kafka/data
        healthcheck:
            test: [ "CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list" ]
            interval: 10s
            timeout: 5s
            retries: 5

    akhq:
        image: tchiotludo/akhq:latest
        container_name: ufaru-go-akhq
        volumes:
            - ./akhq/application.yml:/app/application.yml:ro
        ports:
            - "8080:8080"
        depends_on:
            kafka:
                condition: service_healthy
        restart: unless-stopped

volumes:
    kafka-data:
